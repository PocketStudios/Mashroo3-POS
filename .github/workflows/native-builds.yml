name: Native Multi-Platform Release

on:
  push:
    tags:
      - 'v*' # Only runs when you push a tag like v1.0, v2.1.4, etc.
  workflow_dispatch: # Still allows manual runs if needed

jobs:
  build:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            output: app-release.apk
            command: flutter build apk --release
            path: build/app/outputs/flutter-apk/app-release.apk
          - platform: linux
            os: ubuntu-latest
            output: linux-release.tar.gz
            command: |
              sudo apt-get update
              sudo apt-get install -y ninja-build libgtk-3-dev
              flutter build linux --release
              tar -czf linux-release.tar.gz -C build/linux/x64/release/bundle .
            path: linux-release.tar.gz
          - platform: windows
            os: windows-latest
            output: windows-release.zip
            command: |
              flutter build windows --release
              Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip
            path: windows-release.zip
          - platform: ios
            os: macos-latest
            output: ios-build.zip
            command: |
              flutter build ios --release --no-codesign
              zip -r ios-build.zip build/ios/iphoneos
            path: ios-build.zip
          - platform: macos
            os: macos-latest
            output: macos-release.zip
            command: |
              flutter build macos --release
              zip -r macos-release.zip build/macos/Build/Products/Release
            path: macos-release.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java (Android only)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Platform
        run: ${{ matrix.command }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
